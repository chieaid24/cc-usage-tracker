name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CCUsageTracker.slnx

      - name: Verify formatting
        run: dotnet format CCUsageTracker.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build CCUsageTracker.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test tests/CCUsageTracker.Tests/CCUsageTracker.Tests.csproj
          -c Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore
