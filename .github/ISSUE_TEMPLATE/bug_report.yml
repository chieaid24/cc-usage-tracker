name: Bug report
description: Report behavior that does not work as documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include cookies, tokens, account data, or private log content.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the steps, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove any information you do not want to publish.
      render: text
